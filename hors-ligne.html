<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#12251c" />
<title>CEAI — Hors connexion</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: #12251c; color: #f4f1e8; font-family: Georgia, "Times New Roman", serif; text-align: center;
  }
  .carte { max-width: 380px; }
  .sigle {
    width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center;
    border: 2px solid #d4a23c; color: #f3d27a; font-size: 24px; font-weight: bold; letter-spacing: 0.05em;
  }
  h1 { margin: 0 0 8px; font-size: 22px; color: #d4a23c; }
  p { margin: 0 0 22px; line-height: 1.55; opacity: 0.85; font-family: system-ui, sans-serif; font-size: 15px; }
  button {
    padding: 12px 26px; border: 0; border-radius: 12px; background: #d4a23c; color: #1b1304;
    font: 600 15px system-ui, sans-serif; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="carte">
    <div class="sigle">CEAI</div>
    <h1>Vous êtes hors connexion</h1>
    <p>CEAI a besoin d'internet pour afficher vos données à jour. Vérifiez votre connexion, puis réessayez.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </div>
</body>
  </html>
