<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CEAI — Connaissance Entre Amis Intimes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<!-- ===================== ÉCRAN AUTHENTIFICATION ===================== -->
<div id="ecran-auth" class="ecran-auth">
  <div class="auth-carte">
    <p class="auth-slogan">Engagement · Rigueur · Amitié</p>
    <img src="https://i.postimg.cc/7CJbtf9j/logo.png" alt="Logo CEAI" />
    <!-- Connexion -->
    <form id="formulaire-connexion" class="auth-formulaire">
      <label class="champ">
        <span>Email</span>
        <input type="email" name="email" required autocomplete="email" />
      </label>
      <label class="champ champ-mdp">
        <span>Mot de passe</span>
        <div class="champ-mdp-conteneur">
          <input type="password" name="mot_de_passe" required autocomplete="current-password" />
          <button type="button" class="bouton-oeil" data-cible="formulaire-connexion" aria-label="Afficher le mot de passe">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </label>
      <p class="auth-erreur" data-erreur-pour="formulaire-connexion" hidden></p>
      <button type="submit" class="bouton bouton-or bouton-pleine-largeur">Se connecter</button>
    </form>

    <!-- Inscription -->
    <form id="formulaire-inscription" class="auth-formulaire" hidden>
      <label class="champ">
        <span>Nom complet</span>
        <input type="text" name="nom" required autocomplete="name" />
      </label>
      <label class="champ">
        <span>Email</span>
        <input type="email" name="email" required autocomplete="email" />
      </label>
      <label class="champ champ-mdp">
        <span>Mot de passe</span>
        <div class="champ-mdp-conteneur">
          <input type="password" name="mot_de_passe" required minlength="8" autocomplete="new-password" />
          <button type="button" class="bouton-oeil" data-cible="formulaire-inscription" aria-label="Afficher le mot de passe">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </label>
      <p class="auth-erreur" data-erreur-pour="formulaire-inscription" hidden></p>
      <button type="submit" class="bouton bouton-or bouton-pleine-largeur">Créer mon compte</button>
    </form>

    <p class="auth-bascule">
      <span id="texte-bascule-connexion">Pas encore de compte ?
        <button type="button" id="bouton-vers-inscription" class="lien">S'inscrire</button>
      </span>
      <span id="texte-bascule-inscription" hidden>Déjà un compte ?
        <button type="button" id="bouton-vers-connexion" class="lien">Se connecter</button>
      </span>
    </p>

    <p id="message-confirmation-email" class="auth-confirmation" hidden>
      Un email de confirmation vous a été envoyé. Cliquez sur le lien reçu avant de vous connecter.
    </p>
  </div>
</div>

<!-- ===================== COQUILLE APPLICATION (connecté) ===================== -->
<div id="app-shell" class="app-shell" hidden>

  <header class="entete">
    <div class="entete-marque">
      <img src="https://i.postimg.cc/7CJbtf9j/logo.png" alt="Logo CEAI" class="logo-entete" />
      <span class="entete-valeurs">Engagement · Rigueur · Amitié</span>
    </div>
    <div class="entete-actions">
      <button id="bouton-notifications" class="bouton-icone" aria-label="Notifications">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span id="pastille-notifications" class="pastille" hidden></span>
      </button>
      <button id="bouton-menu" class="bouton-icone" aria-label="Ouvrir le menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <!-- Panneau de notifications -->
  <div id="panneau-notifications" class="panneau-flottant" hidden>
    <p class="panneau-titre">Notifications</p>
    <ul id="liste-notifications" class="liste-notifications"></ul>
  </div>

  <!-- Menu accordéon (navigation) -->
  <nav id="menu-accordeon" class="menu-accordeon" hidden aria-label="Navigation principale">
    <ul class="menu-liste">
      <li><button class="menu-item" data-route="accueil">Accueil</button></li>

      <li class="menu-groupe">
        <button class="menu-item menu-item-groupe" data-groupe="cotisation" aria-expanded="false">
          Cotisation
        </button>
        <ul class="sous-menu" data-sous-menu="cotisation" hidden>
          <li><button class="menu-item" data-route="cotisation/adherer">Adhérer à la cotisation</button></li>
          <li><button class="menu-item" data-route="cotisation/suivi">Suivi de mes cotisations</button></li>
          <li><button class="menu-item" data-route="cotisation/verser">Faire mon versement</button></li>
          <li><button class="menu-item" data-route="cotisation/archives">Sessions clôturées</button></li>
        </ul>
      </li>

      <li class="menu-groupe">
        <button class="menu-item menu-item-groupe" data-groupe="tontine" aria-expanded="false">
          Tontine
        </button>
        <ul class="sous-menu" data-sous-menu="tontine" hidden>
          <li><button class="menu-item" data-route="tontine/rejoindre">Rejoindre la tontine</button></li>
          <li><button class="menu-item" data-route="tontine/suivi">Suivi de mon cycle</button></li>
          <li><button class="menu-item" data-route="tontine/verser">Faire mon versement</button></li>
          <li><button class="menu-item" data-route="tontine/archives">Cycles clôturés</button></li>
        </ul>
      </li>

      <li><button class="menu-item" data-route="publications">Publications</button></li>

      <li class="menu-groupe">
        <button class="menu-item menu-item-groupe" data-groupe="membres" aria-expanded="false">
          Espace Membres
        </button>
        <ul class="sous-menu" data-sous-menu="membres" hidden>
          <li><button class="menu-item" data-route="membres/annuaire">Annuaire des membres</button></li>
          <li><button class="menu-item" data-route="membres/profil">Mon profil</button></li>
          <li><button class="menu-item" data-route="membres/messagerie">Messagerie</button></li>
        </ul>
      </li>

      <li><button class="menu-item" data-route="a-propos">À propos</button></li>
      <li><button class="menu-item" data-route="fondateurs">Fondateurs</button></li>

      <li class="menu-groupe menu-admin" hidden>
        <button class="menu-item menu-item-groupe" data-groupe="admin" aria-expanded="false">
          Administration
        </button>
        <ul class="sous-menu" data-sous-menu="admin" hidden>
          <li><button class="menu-item" data-route="admin/tableau-de-bord">Tableau de bord</button></li>
          <li><button class="menu-item" data-route="admin/membres">Gestion des membres</button></li>
          <li><button class="menu-item" data-route="admin/cotisations">Gestion des cotisations</button></li>
          <li><button class="menu-item" data-route="admin/tontine">Gestion de la tontine</button></li>
          <li><button class="menu-item" data-route="admin/publications">Gestion des publications</button></li>
          <li><button class="menu-item" data-route="admin/notifications">Gestion des notifications</button></li>
          <li><button class="menu-item" data-route="admin/statistiques">Statistiques et rapports</button></li>
        </ul>
      </li>

      <li class="menu-separateur"></li>
      <li><button id="bouton-deconnexion" class="menu-item menu-item-danger">Se déconnecter</button></li>
    </ul>
  </nav>

  <!-- Zone de contenu : le routeur y injecte l'écran actif -->
  <main id="zone-contenu" class="zone-contenu" aria-live="polite">
    <p class="chargement">Chargement…</p>
  </main>

</div>

<script type="module" src="assets/js/supabase-client.js"></script>
<script type="module" src="assets/js/auth.js"></script>
<script type="module" src="assets/js/router.js"></script>
<script type="module" src="assets/js/app.js"></script>
</body>
        </html>
